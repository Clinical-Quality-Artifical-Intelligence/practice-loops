<text x="280" y="216" text-anchor="middle" font-size="13" fill="#0F6E56">iteration</text>
<rect x="348" y="190" width="104" height="42" rx="8" fill="#E1F5EE" stroke="#1D9E75"/>
<text x="400" y="216" text-anchor="middle" font-size="13" fill="#0F6E56">verification</text>

<text x="336" y="150" text-anchor="middle" font-size="22" font-weight="500" fill="#04342C">practice loops</text>
