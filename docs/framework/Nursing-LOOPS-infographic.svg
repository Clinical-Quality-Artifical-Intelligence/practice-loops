<svg viewBox="0 0 680 360" xmlns="http://www.w3.org/2000/svg" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, sans-serif" role="img">
<title>Practice loops for nursing — everything you need to know</title>
<desc>A nursing adaptation of the LOOPS framework: the old prompt way on the left, the six-stage practice loop in the centre, human sign-off on the right, and the hidden components a loop needs along the bottom.</desc>
<defs>
<marker id="ah" markerWidth="9" markerHeight="9" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#5F5E5A"/></marker>
