<text x="340" y="268" text-anchor="middle" font-size="13" fill="#5F5E5A">what nobody tells you a loop needs</text>
<rect x="8" y="278" width="126" height="34" rx="8" fill="#EEEDFE" stroke="#534AB7"/>
<text x="71" y="299" text-anchor="middle" font-size="11.5" fill="#26215C">memory on disk</text>
<rect x="140" y="278" width="126" height="34" rx="8" fill="#EEEDFE" stroke="#534AB7"/>
<text x="203" y="299" text-anchor="middle" font-size="11.5" fill="#26215C">a separate verifier</text>
<rect x="272" y="278" width="126" height="34" rx="8" fill="#EEEDFE" stroke="#534AB7"/>
<text x="335" y="299" text-anchor="middle" font-size="11.5" fill="#26215C">the NMC standard</text>
<rect x="404" y="278" width="126" height="34" rx="8" fill="#EEEDFE" stroke="#534AB7"/>
<text x="467" y="299" text-anchor="middle" font-size="11.5" fill="#26215C">a stop condition</text>
<rect x="536" y="278" width="126" height="34" rx="8" fill="#EEEDFE" stroke="#534AB7"/>
<text x="599" y="299" text-anchor="middle" font-size="11.5" fill="#26215C">equity &amp; audit</text>

<text x="340" y="340" text-anchor="middle" font-size="15" font-weight="500" fill="#2C2C2A">AI supports the workflow. The professional owns the judgement.</text>
