<text x="340" y="32" text-anchor="middle" font-size="24" font-weight="500" fill="#2C2C2A">Practice loops for nursing</text>
<text x="340" y="53" text-anchor="middle" font-size="13" fill="#5F5E5A">everything you need to know — and what nobody tells you</text>

<rect x="8" y="74" width="150" height="156" rx="12" fill="#F1EFE8" stroke="#888780"/>
