<text x="83" y="209" text-anchor="middle" font-size="12" fill="#2C2C2A">stop</text>
<line x1="83" y1="147" x2="83" y2="155" stroke="#5F5E5A" stroke-width="1.4" marker-end="url(#ah)"/>
<line x1="83" y1="183" x2="83" y2="191" stroke="#5F5E5A" stroke-width="1.4" marker-end="url(#ah)"/>

<rect x="522" y="74" width="150" height="156" rx="12" fill="#FAECE7" stroke="#D85A30"/>
<text x="597" y="96" text-anchor="middle" font-size="14" font-weight="500" fill="#712B13">human sign-off</text>
<text x="597" y="111" text-anchor="middle" font-size="10.5" fill="#993C1D">you stay accountable</text>
<rect x="536" y="120" width="122" height="26" rx="6" fill="#FFFFFF" stroke="#F0997B"/>
<text x="597" y="137" text-anchor="middle" font-size="12" fill="#712B13">review</text>
<rect x="536" y="156" width="122" height="26" rx="6" fill="#FFFFFF" stroke="#F0997B"/>
<text x="597" y="173" text-anchor="middle" font-size="12" fill="#712B13">decide</text>
<rect x="536" y="192" width="122" height="26" rx="6" fill="#FFFFFF" stroke="#F0997B"/>
<text x="597" y="209" text-anchor="middle" font-size="12" fill="#712B13">accountable</text>
<line x1="597" y1="147" x2="597" y2="155" stroke="#5F5E5A" stroke-width="1.4" marker-end="url(#ah)"/>
<line x1="597" y1="183" x2="597" y2="191" stroke="#5F5E5A" stroke-width="1.4" marker-end="url(#ah)"/>

<rect x="170" y="78" width="104" height="42" rx="8" fill="#E1F5EE" stroke="#1D9E75"/>
