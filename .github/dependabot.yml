version: 2

updates:
  # The workflows pin actions to full commit SHAs for supply-chain safety. Pinning
  # without automation goes stale silently, so Dependabot raises the version bumps
  # (it rewrites both the SHA and the trailing "# v4" comment).
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "chore(ci)"
    labels:
      - "dependencies"
      - "github-actions"
