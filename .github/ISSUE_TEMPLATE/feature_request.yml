name: Feature request
description: Suggest an idea for a new loop or enhancement
title: '[FEAT]: '
labels: ['enhancement']
assignees: ''

body:
  - type: textarea
    id: problem
    attributes:
      label: Is your feature request related to a problem?
      description: A clear and concise description of what the problem or gap in practice is.
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: Describe the proposed loop or enhancement
      description: Describe the trigger, task, standard, and expected output.
    validations:
      required: true
  - type: textarea
    id: nmc-alignment
    attributes:
      label: NMC / Regulatory Alignment
      description: Which NMC standard, proficiency, or Code clause does this feature map to?
    validations:
      required: false
