name: Bug report
description: Create a report to help us improve Practice Loops
title: '[BUG]: '
labels: ['bug']
assignees: ''

body:
  - type: markdown
    attributes:
      value: Thank you for taking the time to report a bug! Please do NOT post any confidential or patient-identifiable data.
  - type: input
    id: loop
    attributes:
      label: Affected Loop / Skill
      description: Which loop were you running? (e.g. placement-support, clinical-supervision)
      placeholder: e.g. placement-support
    validations:
      required: true
  - type: textarea
    id: describe-bug
    attributes:
      label: Describe the Bug
      description: A clear and concise description of what the bug is.
    validations:
      required: true
  - type: textarea
    id: expected-behavior
    attributes:
      label: Expected Behavior
      description: What did you expect to happen?
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment Info
      description: Claude Code version, OS, model version used.
      placeholder: Claude Code v1.x, Windows/macOS/Linux
    validations:
      required: false
