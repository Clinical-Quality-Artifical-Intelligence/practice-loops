name: Release & Publish Package

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write

    steps:
      # Actions are pinned to full commit SHAs, not mutable tags. This job holds
      # contents: write and packages: write, so a repointed tag on a third-party
      # action would run unreviewed code with publish rights.
      # Dependabot (.github/dependabot.yml) keeps these pins moving forward.
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.x"

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "20.x"
          registry-url: "https://npm.pkg.github.com"
          scope: "@clinical-quality-artifical-intelligence"

      - name: Run Plugin Structure Validation
        run: python scripts/validate.py

      - name: Run Static Guardrail Evals
        run: python scripts/check_guardrails.py

      - name: Build Plugin Zip Bundle
        run: |
          mkdir -p dist
          zip -r dist/practice-loops-plugin.zip plugins/ .claude-plugin/ docs/ README.md LICENSE

      - name: Create GitHub Release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          files: dist/practice-loops-plugin.zip
          name: Release ${{ github.ref_name }}
          body: |
            ## 🩺 Practice Loops for Nursing — ${{ github.ref_name }}
            
            Safe, governed AI practice loops for nurses mapped to NMC (2018) Standards of Proficiency.
            
            ### Included Features:
            - **12 Bounded Practice Loops** (placement support, preceptorship, clinical supervision, EDI, teaching, action tracking, etc.)
            - **NMC Proficiency Reference Database** (29 Year 1, 12+ Year 2, 7 Year 3 proficiencies)
            - **5 Valid Assessment Methods** (Direct Observation, Discussion, Simulation, Spoke Placement, Feedback)
            - **Dual-Gate Governance Architecture** (Gate 1: Diagnostic Reasoning; Gate 2: Final DRAFT Sign-Off)
            - **Automated Audit Logging** (`./practice-loop-audit/`)
            
            ### Installation:
            ```bash
            /plugin install https://github.com/Clinical-Quality-Artifical-Intelligence/practice-loops
            ```
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish to GitHub Packages (npm registry)
        run: npm publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
