name: validate

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Least privilege: this workflow only reads the tree. Without an explicit block the
# job inherits the repository/organisation default, which on older repos is
# read-write — and this workflow is pull_request-triggered.
permissions:
  contents: read

jobs:
  validate:
    # Run on both platforms: the project targets nurse citizen-developers, who are
    # predominantly on Windows. Ubuntu alone hides locale-encoding bugs, because
    # Python defaults to UTF-8 there and to cp1252 on Windows.
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      # Actions are pinned to full commit SHAs, not mutable tags: a tag can be
      # repointed at new code, which would run unreviewed changes in CI.
      # Dependabot (.github/dependabot.yml) keeps these pins moving forward.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.x"
      # Use `python`, not `python3`: setup-python provides `python` on every runner,
      # whereas `python3` does not resolve on Windows.
      - name: Validate plugin structure
        run: python scripts/validate.py
      - name: Check loop guardrails (static eval)
        run: python scripts/check_guardrails.py
      - name: Validate manifests are valid JSON
        run: python scripts/check_manifests.py
