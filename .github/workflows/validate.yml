name: validate

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Validate plugin structure
        run: python3 scripts/validate.py
      - name: Check loop guardrails (static eval)
        run: python3 scripts/check_guardrails.py
      - name: Validate manifests are valid JSON
        run: |
          python3 -c "import json,sys; json.load(open('.claude-plugin/marketplace.json')); json.load(open('plugins/practice-loops/.claude-plugin/plugin.json')); print('manifests OK')"
